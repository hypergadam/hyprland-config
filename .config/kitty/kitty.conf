# Colours and opacity come from ~/.config/theme/palette.toml via `theme-apply`.
include current-theme.conf

# ---- Typography ----
# Same stack as WezTerm: JetBrains Mono for text, Symbols Nerd Font Mono for
# the icon ranges it doesn't cover (devicons, material, seti, powerline).
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7 Symbols Nerd Font Mono
symbol_map U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

disable_ligatures cursor
adjust_line_height 110%

# ---- Window ----
# One value pads all four sides; kitty has no window_padding_height (the old
# config had one, and kitty was silently ignoring it).
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# ---- Cursor ----
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 1

# ---- Scrollback ----
scrollback_lines 10000
enable_audio_bell no

# ---- Tabs ----
# Colours for these come from current-theme.conf; the shape is set here.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# Optional blur (works depending on compositor/platform)
# background_blur 20
