# Portal routing for Hyprland.
# Filename must match lowercased XDG_CURRENT_DESKTOP (Hyprland -> hyprland-portals.conf).
# An explicit [preferred] entry overrides each .portal file's UseIn= restriction,
# which is why kde can serve dialogs even though its UseIn says KDE only.

[preferred]
# Everything not listed below: Hyprland first (screencopy), then GTK.
default=hyprland;gtk

# --- File dialogs: KDE/Dolphin-style chooser ---
# Breeze icons render natively here, the Places sidebar is shared with Dolphin,
# and the dialog has a preview pane.
org.freedesktop.impl.portal.FileChooser=kde

# Keep the rest of the "pick something" dialogs on the same toolkit so
# open/import/print all look like one desktop.
org.freedesktop.impl.portal.AppChooser=kde
org.freedesktop.impl.portal.Print=kde

# --- Screen capture stays with the compositor ---
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland

# --- Settings stays on GTK ---
# This is what tells GTK/Electron/Chromium apps "prefer dark". Routing it to kde
# under a non-Plasma session can report an unthemed light scheme.
org.freedesktop.impl.portal.Settings=gtk
