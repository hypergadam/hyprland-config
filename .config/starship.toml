# ~/.config/starship.toml
#
# Colours come from ~/.config/theme/palette.toml via `theme-apply`, which owns
# the [palettes.theme] block at the bottom of this file. starship has no
# include directive, so that delimited block is the exception to the usual
# "generated colours live in their own file" rule -- everything above it is
# yours to hand-edit. Refer to palette names here, never to raw hex.

palette = "theme"

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$golang\
$nodejs\
$python\
$rust\
$docker_context\
$kubernetes\
$fill\
$jobs\
$status\
$cmd_duration\
$line_break\
$character"""

# A faint dotted leader pushes timing and status to the right margin, so the
# left side stays a stable "where am I" column no matter how long the line is.
[fill]
symbol = "·"
style = "fg:bg_raised"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold warning)"

[username]
show_always = false
style_user = "bold info"
style_root = "bold error"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold warning"
format = "on [$hostname]($style) "

[directory]
style = "bold accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "error"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "fg_muted"
format = "on [$symbol$branch]($style) "

[git_status]
style = "warning"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold error"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[golang]
symbol = " "
style = "cyan"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "success"
format = "via [$symbol$version]($style) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "warning"
format = "via [$symbol$version]($style) "
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "tox.ini", ".python-version"]
detect_folders = [".venv", "venv"]

[rust]
symbol = " "
style = "accent"
format = "via [$symbol$version]($style) "

[docker_context]
symbol = " "
style = "info"
format = "via [$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "☸ "
style = "info"
format = "on [$symbol$context( \\($namespace\\))]($style) "
detect_files = ["k8s.yaml", "kubernetes.yaml"]
detect_folders = ["k8s", ".kube"]

[jobs]
symbol = " "
style = "magenta"
number_threshold = 1
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘ "
style = "bold error"
format = "[$symbol$status]($style) "
map_symbol = true
pipestatus = true

[cmd_duration]
min_time = 1000
style = "fg_disabled"
format = "[󰔟 $duration]($style) "

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[java]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[perl]
disabled = true

[lua]
disabled = true

[scala]
disabled = true

[haskell]
disabled = true

[memory_usage]
disabled = true

[battery]
disabled = true

# >>> theme-apply:palette >>>
# GENERATED by theme-apply from ~/.config/theme/palette.toml -- do not edit
[palettes.theme]
# semantic roles -- what the prompt modules reference
accent      = "#798186"
accent_dim  = "#a8adb0"
accent_text = "#080a0b"
bg          = "#101315"
bg_dim      = "#0c0e10"
bg_raised   = "#212121"
bg_selected = "#2c2c2d"
fg          = "#cacccc"
fg_muted    = "#949494"
fg_disabled = "#7f7f7f"
outline     = "#212121"
error       = "#de6145"
warning     = "#c9c2b4"
success     = "#9fa5a9"
info        = "#798186"
# the 16 ANSI slots by name, for ad-hoc use in hand-written modules
black          = "#101315"
red            = "#565d60"
green          = "#9fa5a9"
yellow         = "#d9dbdc"
blue           = "#798186"
magenta        = "#aeaeae"
cyan           = "#707070"
white          = "#cbc2be"
bright_black   = "#4b4e55"
bright_red     = "#de6145"
bright_green   = "#343d41"
bright_yellow  = "#c9c2b4"
bright_blue    = "#5d6367"
bright_magenta = "#9a9a9a"
bright_cyan    = "#707070"
bright_white   = "#a5aeb4"
# <<< theme-apply:palette <<<
