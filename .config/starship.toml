# ~/.config/starship.toml
#
# Colours come from ~/.config/theme/palette.toml via `theme-apply`, which owns
# the [palettes.theme] block at the bottom of this file. starship has no
# include directive, so that delimited block is the exception to the usual
# "generated colours live in their own file" rule -- everything above it is
# yours to hand-edit. Refer to palette names here, never to raw hex.

palette = "theme"

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$golang\
$nodejs\
$python\
$rust\
$docker_context\
$kubernetes\
$fill\
$jobs\
$status\
$cmd_duration\
$line_break\
$character"""

# A faint dotted leader pushes timing and status to the right margin, so the
# left side stays a stable "where am I" column no matter how long the line is.
[fill]
symbol = "·"
style = "fg:bg_raised"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold warning)"

[username]
show_always = false
style_user = "bold info"
style_root = "bold error"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold warning"
format = "on [$hostname]($style) "

[directory]
style = "bold accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "error"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "fg_muted"
format = "on [$symbol$branch]($style) "

[git_status]
style = "warning"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold error"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[golang]
symbol = " "
style = "cyan"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "success"
format = "via [$symbol$version]($style) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "warning"
format = "via [$symbol$version]($style) "
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "tox.ini", ".python-version"]
detect_folders = [".venv", "venv"]

[rust]
symbol = " "
style = "accent"
format = "via [$symbol$version]($style) "

[docker_context]
symbol = " "
style = "info"
format = "via [$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "☸ "
style = "info"
format = "on [$symbol$context( \\($namespace\\))]($style) "
detect_files = ["k8s.yaml", "kubernetes.yaml"]
detect_folders = ["k8s", ".kube"]

[jobs]
symbol = " "
style = "magenta"
number_threshold = 1
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘ "
style = "bold error"
format = "[$symbol$status]($style) "
map_symbol = true
pipestatus = true

[cmd_duration]
min_time = 1000
style = "fg_disabled"
format = "[󰔟 $duration]($style) "

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[java]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[perl]
disabled = true

[lua]
disabled = true

[scala]
disabled = true

[haskell]
disabled = true

[memory_usage]
disabled = true

[battery]
disabled = true

# >>> theme-apply:palette >>>
# GENERATED by theme-apply from ~/.config/theme/palette.toml -- do not edit
[palettes.theme]
# semantic roles -- what the prompt modules reference
accent      = "#e15a48"
accent_dim  = "#f0b45a"
accent_text = "#08070e"
bg          = "#12101c"
bg_dim      = "#0c0a14"
bg_raised   = "#221c2c"
bg_selected = "#2c2438"
fg          = "#f0c4a8"
fg_muted    = "#8a6e6c"
fg_disabled = "#6d5a68"
outline     = "#221c2c"
error       = "#d6453d"
warning     = "#f0b45a"
success     = "#7e9a6a"
info        = "#5b7fa8"
# the 16 ANSI slots by name, for ad-hoc use in hand-written modules
black          = "#12101c"
red            = "#d6453d"
green          = "#7e9a6a"
yellow         = "#f0b45a"
blue           = "#5b7fa8"
magenta        = "#c45c78"
cyan           = "#4a9bb0"
white          = "#f0c4a8"
bright_black   = "#6d5a68"
bright_red     = "#f06a58"
bright_green   = "#9ab57e"
bright_yellow  = "#f6cc7a"
bright_blue    = "#7a9cc4"
bright_magenta = "#e07a94"
bright_cyan    = "#7ec4d2"
bright_white   = "#f7e0cc"
# <<< theme-apply:palette <<<
