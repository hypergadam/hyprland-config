general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/hypergadam/.config/hypr/wallpapers/material-you.jpg
    blur_passes = 3
    blur_size = 6
    color = rgba(141218ff)
}

input-field {
    monitor =
    size = 320, 60
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 24
    outer_color = rgba(d0bcffff)
    inner_color = rgba(2b2930ff)
    font_color = rgba(e6e0e9ff)
    font_family = Noto Sans
    placeholder_text = Enter your password
    fail_text = $PAMFAIL
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Noto Sans
    color = rgba(e6e0e9ff)
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    font_size = 18
    font_family = Noto Sans
    color = rgba(cac4d0ff)
    position = 0, 60
    halign = center
    valign = center
}
