# Colours come from ~/.config/theme/palette.toml via `theme-apply`.
source = /home/hypergadam/.config/hypr/theme-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    color = $bg_deep
}

input-field {
    monitor =
    size = 320, 60
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 24
    outer_color = $accent
    inner_color = $bg_raised
    font_color = $fg
    font_family = Noto Sans
    placeholder_text = Enter your password
    fail_text = $PAMFAIL
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Noto Sans
    color = $fg
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    font_size = 18
    font_family = Noto Sans
    color = $fg_muted
    position = 0, 60
    halign = center
    valign = center
}
