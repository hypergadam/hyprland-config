general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 320, 60
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 12
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    font_family = Noto Sans
    placeholder_text = Enter your password
    fail_text = $PAMFAIL
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Noto Sans
    color = rgba(cdd6f4ff)
    position = 0, 100
    halign = center
    valign = center
}
