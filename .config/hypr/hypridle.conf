# hypridle - idle and sleep management for Hyprland.
#
# The important part is the general block: without before_sleep_cmd the machine
# suspends with the desktop still unlocked and resumes straight onto it, which
# is why "sleep mode" did not appear to shut the UI down.

general {
    # Runs whenever the session is locked -- by Super+L, by loginctl, or
    # before suspend. The guard stops a second hyprlock stacking on the first.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock BEFORE suspending, so the machine never resumes unlocked.
    before_sleep_cmd = loginctl lock-session

    # Displays can come back blank after resume; re-enable them explicitly.
    # Note the Lua form: this config uses Hyprland's Lua API, where
    # `hyprctl dispatch dpms off` is parsed as Lua and fails.
    #
    # Pass the state as a TABLE field named `action`, not positionally.
    # Hyprland reads it with tableToggleAction(L, idx, field = "action")
    # (config/lua/bindings/LuaBindingsInternal.hpp), and the action enum's
    # zero value is TOGGLE_ACTION_TOGGLE -- so a positional string risks
    # being read as "toggle" rather than an explicit on/off.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    ignore_dbus_inhibit = false
}

# ---------------------------------------------------------------------------
# Lock-screen blanking -- the KDE/Plasma behaviour: once the lock screen is
# up, the displays go dark shortly after you stop touching the machine, and
# the first keypress or mouse move brings them both straight back.
#
# The short timeout is what ARMS the restore: hypridle only fires on-resume
# for a listener that has actually timed out. Pairing off/on in one listener
# is the whole point -- the previous setup blanked from lock.sh and relied on
# Hyprland's implicit wake-on-input, which does not reliably bring eDP-1 back
# on this machine.
#
# Both sides are guarded inside screen-blank.sh: it only blanks while hyprlock
# is running (so an idle unlocked desktop never goes dark), and only restores
# if it was the one that blanked (so dpms-on, which forces a slow modeset on
# this amdgpu, never runs on an ordinary keypress).
# ---------------------------------------------------------------------------

listener {
    timeout = 3
    on-timeout = /home/hypergadam/.config/hypr/screen-blank.sh off
    on-resume = /home/hypergadam/.config/hypr/screen-blank.sh on
}

# ---------------------------------------------------------------------------
# Optional extras -- not enabled. Uncomment to turn one on; timeouts are
# seconds since the last input.
# ---------------------------------------------------------------------------

